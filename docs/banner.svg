<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="PII Toolbox: find personal information, mask it, restore it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131f38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5b94a"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="360" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#dots)"/>
    <circle cx="900" cy="180" r="260" fill="url(#glow)"/>
    <rect x="0" y="354" width="1280" height="6" fill="url(#accent)"/>
  </g>

  <!-- Shield mark -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 74 l22 -8 l22 8 v16 c0 14 -9 24 -22 28 c-13 -4 -22 -14 -22 -28 z" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-width="2.5"/>
    <path d="M76 92 l8 8 l14 -15" stroke="#2dd4bf" stroke-width="3"/>
  </g>

  <!-- Title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="62" y="190" font-size="60" font-weight="700" fill="#f4f7fb" letter-spacing="-1">PII Toolbox</text>
  </g>

  <!-- Original text card -->
  <rect x="560" y="80" width="300" height="200" rx="14" fill="#16223a" stroke="#2a3a5c"/>
  <!-- Masked text card -->
  <rect x="940" y="80" width="300" height="200" rx="14" fill="#16223a" stroke="#2dd4bf" stroke-opacity="0.45"/>

  <!-- Highlights behind names -->
  <g fill="#f5b94a" fill-opacity="0.16" stroke="#f5b94a" stroke-opacity="0.55">
    <rect x="580" y="134" width="100.4" height="22" rx="5"/>
    <rect x="714.4" y="134" width="92" height="22" rx="5"/>
    <rect x="580" y="168" width="41.6" height="22" rx="5"/>
    <rect x="580" y="202" width="92" height="22" rx="5"/>
  </g>
  <!-- Highlights behind placeholders -->
  <g fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.55">
    <rect x="960" y="134" width="92" height="22" rx="5"/>
    <rect x="1086" y="134" width="92" height="22" rx="5"/>
    <rect x="960" y="168" width="92" height="22" rx="5"/>
    <rect x="960" y="202" width="92" height="22" rx="5"/>
  </g>

  <!-- Faint placeholder lines at the bottom of each card -->
  <g fill="#ffffff" fill-opacity="0.07">
    <rect x="584" y="242" width="180" height="8" rx="4"/>
    <rect x="584" y="258" width="120" height="8" rx="4"/>
    <rect x="964" y="242" width="180" height="8" rx="4"/>
    <rect x="964" y="258" width="120" height="8" rx="4"/>
  </g>

  <!-- Lock between the cards -->
  <line x1="862" y1="180" x2="938" y2="180" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 5"/>
  <circle cx="900" cy="180" r="26" fill="#0f1a30" stroke="url(#accent)" stroke-width="2"/>
  <g fill="none" stroke="#e8eef7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M893 178 v-5 a7 7 0 0 1 14 0 v5"/>
    <rect x="889" y="178" width="22" height="16" rx="3.5" fill="#e8eef7" fill-opacity="0.12"/>
    <path d="M900 184 v4"/>
  </g>
</svg>
