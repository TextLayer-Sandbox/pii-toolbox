[project]
name = "pii-toolbox"
version = "0.1.0"
description = "Local PII detection, evaluation and session tools with reproducible measured results."
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_toolbox"]

[dependency-groups]
dev = [
    "pytest>=8",  # test runner
]
detection = [
    "presidio-analyzer",  # pattern and checksum recognisers and the recogniser framework
    "spacy",  # NER pipelines run as recognisers
]
models = [
    "gliner",  # GLiNER PII model
    "transformers",  # RoBERTa token-classification pipeline
    "torch",  # backend for the transformer and GLiNER models
]
evaluation = [
    "datasets",  # loads MAPA from Hugging Face
    "huggingface_hub",  # downloads model files and datasets
    "numpy",  # score and statistics arithmetic
    "matplotlib",  # result figures
    "psutil",  # peak memory measurement in cost runs
    "tqdm",  # progress bars in TAB's evaluation script
    "pandas",  # TAB's evaluation script reads and joins annotation tables
    "intervaltree",  # TAB's evaluation script looks up character spans
]
coref = [
    "pyzmq",  # carries messages to the co-reference worker running in its own environment
]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not model and not data and not network'"
testpaths = ["tests"]
markers = [
    "model: needs model files downloaded",
    "data: needs a dataset downloaded",
    "network: needs network access",
]

[tool.uv]
default-groups = "all"
