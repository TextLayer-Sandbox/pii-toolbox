[project]
name = "pii-toolbox"
version = "0.1.0"
description = "Local PII detection, evaluation and session tools with reproducible measured results."
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_toolbox"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8",  # test runner
]
detection = [
    "presidio-analyzer",  # pattern and checksum recognisers and the recogniser framework
    "spacy",  # NER pipelines run as recognisers
    "tldextract>=5.4.0",  # splits email domains when validating addresses
]
models = [
    "gliner",  # GLiNER PII model
    "transformers",  # RoBERTa token-classification pipeline
    "torch",  # backend for the transformer and GLiNER models
]
evaluation = [
    "datasets",  # loads MAPA from Hugging Face
    "huggingface_hub",  # downloads model files and datasets
    "numpy",  # score and statistics arithmetic
    "matplotlib",  # result figures
    "psutil",  # peak memory measurement in cost runs
    "tqdm",  # progress bars in TAB's evaluation script
    "pandas",  # TAB's evaluation script reads and joins annotation tables
    "intervaltree",  # TAB's evaluation script looks up character spans
]
notebook = [
    "jupyterlab",  # opens and edits the results notebook; brings nbconvert to execute it from the command line
    "ipykernel",  # the Python kernel a notebook runs its cells in
]
coref = [
    "pyzmq",  # carries messages to the co-reference worker running in its own environment
]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not model and not data and not network and not repo_contents'"
testpaths = ["tests"]
markers = [
    "model: needs model files downloaded",
    "data: needs a dataset downloaded",
    "network: needs network access",
    "repo_contents: checks what is committed in the repository",
]

[tool.pyright]
include = ["src", "tests", "scripts", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

# The worker runs in its own environment; create it with `uv sync --project src/pii_toolbox/coref/worker`.
[[tool.pyright.executionEnvironments]]
root = "src/pii_toolbox/coref/worker"
extraPaths = ["src/pii_toolbox/coref/worker/.venv/lib/python3.12/site-packages"]

[tool.uv]
default-groups = ["dev", "detection", "evaluation", "coref"]
